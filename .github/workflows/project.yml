name: Telenor Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-cd:
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean up Docker resources
        run: |
          docker image prune -f || true
          docker builder prune -f || true

      - name: Check disk usage on runner
        run: |
          echo "=== Disk usage summary ==="
          df -h || true
          echo "\n=== Detailed / and /home usage ==="
          du -sh / /home 2>/dev/null || true
          echo "\n=== Inodes and available GB ==="
          df -i || true
          avail_gb=$(df -BG / | tail -n1 | awk '{print $4}' | sed 's/G//' || true)
          echo "Available GB on /: $avail_gb"
          # Warn if less than 1GB available on root
          if [ -n "$avail_gb" ] && [ "$avail_gb" -lt 1 ]; then
            echo "WARNING: less than 1GB available on / (available GB: $avail_gb)"
            echo "Consider cleaning caches or increasing disk before heavy installs/builds."
          else
            echo "Sufficient disk space detected."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/telenor-kb:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/telenor-kb:${{ github.sha }}

      - name: Verify pushed image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/telenor-kb:${{ github.sha }}
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
            -e BETTER_AUTH_URL="${{ secrets.BETTER_AUTH_URL }}" \
            -p 3001:3000 \
            --name telenor-kb-verify \
            ${{ secrets.DOCKERHUB_USERNAME }}/telenor-kb:${{ github.sha }} &
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:3001/ || (docker stop telenor-kb-verify && exit 1)
          docker stop telenor-kb-verify

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sh /home/server/project-horizon/deploy/pi/update.sh

      - name: Verify production deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused https://telenor.jensnic.no/

      - name: Lighthouse performance audit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://telenor.jensnic.no/
          budgetPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Update Lighthouse report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node - <<'EOF'
          const fs = require('fs')
          const path = require('path')
          const dir = '${{ steps.lighthouse.outputs.resultsPath }}'
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json') && !f.includes('manifest') && !f.startsWith('flags-')).sort()
          if (!files.length) process.exit(0)
          const runs = files.map(file => {
            const raw = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf-8'))
            const cats = raw.categories
            return {
              runAt: raw.fetchTime ?? new Date().toISOString(),
              url: raw.finalUrl,
              scores: {
                performance: cats.performance?.score ?? 0,
                accessibility: cats.accessibility?.score ?? 0,
                bestPractices: cats['best-practices']?.score ?? 0,
                seo: cats.seo?.score ?? 0,
              }
            }
          })
          const avg = key => runs.reduce((s, r) => s + r.scores[key], 0) / runs.length
          const report = {
            generatedAt: new Date().toISOString(),
            url: runs[0].url,
            averageScores: {
              performance: avg('performance'),
              accessibility: avg('accessibility'),
              bestPractices: avg('bestPractices'),
              seo: avg('seo'),
            },
            runs,
          }
          fs.writeFileSync('public/lighthouse-report.json', JSON.stringify(report, null, 2))
          console.log('Report written. Averages:', JSON.stringify(report.averageScores))
          EOF

      - name: Commit Lighthouse report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lighthouse-report.json
          git diff --cached --quiet || git commit -m "chore: update Lighthouse report [skip ci]"
          git push

